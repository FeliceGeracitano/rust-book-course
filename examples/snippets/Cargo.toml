[package]
name = "snippets"
version = "0.0.0"
edition = "2024"
publish = false
autobins = true
autotests = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
crossbeam-channel = "0.5.17"
rayon = "1.12.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "timeout"] }

[dev-dependencies]
insta = "1.48.0"
proptest = "1.11.0"
rstest = "0.27.0"
wiremock = "0.6.5"
